name: Plane PR Sync

# GitHub PRs ⇄ Plane project PASEO (plane.aight.to). A PR whose branch or title names a ticket
# (hand-off branches look like `paseo-7-…`) moves that ticket: draft → In Progress,
# open → In Review, merged → Done. Other PRs get their own work item labelled `plane-to-paseo`.
# Each PR gets one comment linking its ticket. Logic: scripts/plane-pr-sync.mjs.
# Backfill: Actions → Plane PR Sync → Run workflow.

on:
  pull_request:
    types: [opened, edited, reopened, closed, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      all:
        description: Re-sync every PR in the repo (idempotent)
        type: boolean
        default: true

concurrency:
  group: plane-pr-sync-${{ github.event.pull_request.number || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write # the sync comment
  issues: write

jobs:
  sync:
    # Plane being down must not block merging: this job is informational.
    name: Plane sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync
        env:
          PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}
          PLANE_URL: ${{ vars.PLANE_URL || 'https://plane.aight.to' }}
          PLANE_PROJECT: PASEO
          PLANE_LABEL: plane-to-paseo
          GH_TOKEN: ${{ github.token }}
          ALL: ${{ inputs.all }}
        run: |
          if [ "$ALL" = "true" ]; then
            node scripts/plane-pr-sync.mjs --all
          else
            node scripts/plane-pr-sync.mjs
          fi
